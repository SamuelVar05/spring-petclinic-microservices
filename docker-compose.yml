x-app-env: &app-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker,mysql}
  SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST:-mysql-petclinic}:${DB_PORT:-3306}/${MYSQL_DATABASE:-petclinic}?${DB_PARAMS:-allowPublicKeyRetrieval=true&useSSL=false}
  SPRING_DATASOURCE_USERNAME: ${DB_USER:-root}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?define DB_PASSWORD en .env}

x-mem: &mem
  resources:
    limits:
      memory: ${MEM_LIMIT:-512M}

services:
  mysql-petclinic:
    image: ${MYSQL_IMAGE:-mysql:8.4.5}
    container_name: mysql-petclinic
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?define MYSQL_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-petclinic}
    volumes:
      - mysql-petclinic-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  config-server:
    image: ${IMAGE_REGISTRY:-springcommunity}/spring-petclinic-config-server:${IMAGE_TAG:-latest}
    container_name: config-server
    deploy: *mem
    healthcheck:
      test: ["CMD", "curl", "-I", "http://config-server:8888"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"

  discovery-server:
    image: ${IMAGE_REGISTRY:-springcommunity}/spring-petclinic-discovery-server:${IMAGE_TAG:-latest}
    container_name: discovery-server
    deploy: *mem
    healthcheck:
      test: ["CMD", "curl", "-f", "http://discovery-server:8761"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "${DISCOVERY_SERVER_PORT:-8761}:8761"

  customers-service:
    image: ${IMAGE_REGISTRY:-springcommunity}/spring-petclinic-customers-service:${IMAGE_TAG:-latest}
    container_name: customers-service
    environment: *app-env
    deploy: *mem
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql-petclinic:
        condition: service_healthy
    ports:
      - "${CUSTOMERS_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s

  visits-service:
    image: ${IMAGE_REGISTRY:-springcommunity}/spring-petclinic-visits-service:${IMAGE_TAG:-latest}
    container_name: visits-service
    environment: *app-env
    deploy: *mem
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql-petclinic:
        condition: service_healthy
      customers-service:
        condition: service_healthy
    ports:
      - "${VISITS_PORT:-8082}:8082"

  vets-service:
    image: ${IMAGE_REGISTRY:-springcommunity}/spring-petclinic-vets-service:${IMAGE_TAG:-latest}
    container_name: vets-service
    environment: *app-env
    deploy: *mem
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      mysql-petclinic:
        condition: service_healthy
    ports:
      - "${VETS_PORT:-8083}:8083"

  api-gateway:
    image: ${IMAGE_REGISTRY:-springcommunity}/spring-petclinic-api-gateway:${IMAGE_TAG:-latest}
    container_name: api-gateway
    deploy: *mem
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${API_GATEWAY_PORT:-8080}:8080"

  admin-server:
    image: ${IMAGE_REGISTRY:-springcommunity}/spring-petclinic-admin-server:${IMAGE_TAG:-latest}
    container_name: admin-server
    deploy: *mem
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    ports:
      - "${ADMIN_SERVER_PORT:-9090}:9090"

volumes:
  mysql-petclinic-data: